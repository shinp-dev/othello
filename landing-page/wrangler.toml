name = "chanriva"
main = "dist/server/index.js"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://zgzllmaoyymoeiqtybck.supabase.co"
# Raise only after the corresponding Android version is available to users.
ANDROID_MIN_VERSION_CODE = "1"
# Set with: wrangler secret put SUPABASE_ANON_KEY
# This is the public Supabase client key used server-side; never use the service-role key here.

[assets]
directory = "./dist/client"
binding = "ASSETS"

[[routes]]
pattern = "chanriva.shinp-studio.com"
custom_domain = true
