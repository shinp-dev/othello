name: Mode selection visual check
on:
  push:
    branches: [feat/enjoyment-choice-cloud-ui]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render Japanese Compose screen on two emulator widths
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p screenshots
            for spec in 360x760 390x844; do
              width="${spec%%x*}"
              adb shell wm size "$spec"
              adb shell wm density 160
              adb shell am force-stop com.shinpstudio.chanriva || true
              ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.othello.ModeSelectionScreenshotTest -Pandroid.testInstrumentationRunnerArguments.captureWidth="$width"
              adb pull "/sdcard/Android/data/com.shinpstudio.chanriva/files/mode-${width}dp-top.png" screenshots/
              adb pull "/sdcard/Android/data/com.shinpstudio.chanriva/files/mode-${width}dp-bottom.png" screenshots/
            done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mode-selection-screenshots
          path: screenshots/*.png
          if-no-files-found: error
