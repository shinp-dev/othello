name: apply-advanced-mode-switch-fix

on:
  push:
    branches:
      - fix/advanced-mode-switch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/advanced-mode-switch
      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          nav = "app/src/main/kotlin/com/example/othello/StandardModeNavigation.kt"
          replace_exact(
              nav,
              "    AuthenticatedModeDestination.MODE_SELECTION,\n    AuthenticatedModeDestination.ADVANCED -> null",
              "    AuthenticatedModeDestination.MODE_SELECTION -> null\n    AuthenticatedModeDestination.ADVANCED -> AuthenticatedModeDestination.MODE_SELECTION",
          )
          replace_exact(
              nav,
              "    advancedContent: @Composable () -> Unit,",
              "    advancedContent: @Composable (onSwitchMode: () -> Unit) -> Unit,",
          )
          replace_exact(
              nav,
              "        AuthenticatedModeDestination.ADVANCED -> advancedContent()",
              "        AuthenticatedModeDestination.ADVANCED -> advancedContent {\n            destination = AuthenticatedModeDestination.MODE_SELECTION\n        }",
          )

          main = "app/src/main/kotlin/com/example/othello/MainActivity.kt"
          replace_exact(
              main,
              "        AuthenticatedModeRoute(session.userId) {\n            AuthenticatedApp(",
              "        AuthenticatedModeRoute(session.userId) { onSwitchMode ->\n            AuthenticatedApp(",
          )
          replace_exact(
              main,
              "                session = session,\n            )",
              "                session = session,\n                onSwitchMode = onSwitchMode,\n            )",
          )
          replace_exact(
              main,
              "    sessionOwner: OnlineSessionViewModel,\n    session: UserSession,\n) {",
              "    sessionOwner: OnlineSessionViewModel,\n    session: UserSession,\n    onSwitchMode: () -> Unit,\n) {",
          )
          replace_exact(
              main,
              "                    destination == AppDestination.MORE -> MoreScreen(\n                        onAccount = { destination = AppDestination.ACCOUNT },",
              "                    destination == AppDestination.MORE -> MoreScreen(\n                        onSwitchMode = onSwitchMode,\n                        onAccount = { destination = AppDestination.ACCOUNT },",
          )

          top = "app/src/main/kotlin/com/example/othello/TopLevelScreens.kt"
          replace_exact(
              top,
              "internal fun MoreScreen(\n    onAccount: () -> Unit,",
              "internal fun MoreScreen(\n    onSwitchMode: () -> Unit,\n    onAccount: () -> Unit,",
          )
          replace_exact(
              top,
              "        ChanrivaScreenHeader(appString(R.string.more))\n        ChanrivaNavigationRow(appString(R.string.account), onAccount)",
              "        ChanrivaScreenHeader(appString(R.string.more))\n        ChanrivaNavigationRow(appString(R.string.switch_mode), onSwitchMode)\n        ChanrivaNavigationRow(appString(R.string.account), onAccount)",
          )

          test = "app/src/test/kotlin/com/example/othello/StandardModeNavigationTest.kt"
          replace_exact(
              test,
              "import kotlin.test.assertNull\n",
              "",
          )
          replace_exact(
              test,
              "    fun standardHomeReturnsToModeSelectionWithoutChangingAdvancedBackHandling() {",
              "    fun bothModeHomesReturnToModeSelection() {",
          )
          replace_exact(
              test,
              "        assertNull(authenticatedModeBackDestination(AuthenticatedModeDestination.MODE_SELECTION))\n        assertNull(authenticatedModeBackDestination(AuthenticatedModeDestination.ADVANCED))",
              "        assertEquals(\n            null,\n            authenticatedModeBackDestination(AuthenticatedModeDestination.MODE_SELECTION),\n        )\n        assertEquals(\n            AuthenticatedModeDestination.MODE_SELECTION,\n            authenticatedModeBackDestination(AuthenticatedModeDestination.ADVANCED),\n        )",
          )

          Path("app/src/main/res/values/advanced_mode_switch.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="switch_mode">Switch mode</string>\n</resources>\n'
          )
          Path("app/src/main/res/values-ja/advanced_mode_switch.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="switch_mode">モードを切り替える</string>\n</resources>\n'
          )

          Path(".github/workflows/apply-advanced-mode-switch-fix.yml").unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow switching back from Advanced mode"
          git push origin HEAD:fix/advanced-mode-switch
