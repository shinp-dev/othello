name: Standard winning tips screenshots
on:
  push:
    branches: [codex/winning-tips-list, codex/winning-tip-detail]
    paths:
      - '.github/scripts/capture-standard-winning-tips.sh'
      - '.github/workflows/standard-winning-tips-screenshots.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  pull_request:
    paths:
      - '.github/scripts/capture-standard-winning-tips.sh'
      - '.github/workflows/standard-winning-tips-screenshots.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render StandardWinningTipsRoute at 320dp, 360dp, and 390dp
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/capture-standard-winning-tips.sh
      - name: Upload StandardWinningTipsRoute PNGs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-winning-tips-screenshots
          path: |
            screenshots/standard-winning-tips-*.png
            screenshots/standard-winning-tip-*.png
          if-no-files-found: error
